name: Релиз каталога

# Каталог (пакеты .qdrv, drivers.index, исходники) лежит в catalog/;
# пакеты подписаны ключом каталога Quadrix при сборке. При изменении
# catalog/VERSION публикуется релиз v<версия> — Quadrix OS берёт
# последний: …/releases/latest/download/drivers.index.

on:
  push:
    branches: [main]
    paths: ['catalog/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat catalog/VERSION)"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" catalog/*.qdrv catalog/drivers.index catalog/*.tar --clobber
          else
            gh release create "v$V" catalog/*.qdrv catalog/drivers.index catalog/*.tar \
              --title "Драйверы Linux для Quadrix $V" \
              --notes "Пакеты драйверов (.qdrv), каталог drivers.index и исходники слоя драйверов (GPLv2)." \
              --latest
          fi
